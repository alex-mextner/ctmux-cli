# Ghostty settings for the ctmux window (`ctmux terminal` starts Ghostty with --config-file=this,
# under its own class so it does not share a Ghostty instance with plain terminals). It is layered
# over ~/.config/ghostty/config, so fonts and themes stay yours.
#
# Ghostty binds Ctrl+Tab / Ctrl+Shift+Tab to its own tabs, Ctrl+Shift+T to a new tab and Alt+1..9
# to "go to tab N". In a ctmux window the tabs are tmux windows, so those keys are re-sent to tmux
# as CSI-u / ESC sequences, and linux/tmux.conf binds them.
keybind = ctrl+tab=csi:9;5u
keybind = ctrl+shift+tab=csi:9;6u
keybind = ctrl+shift+t=csi:116;6u
keybind = alt+one=text:\x1b1
keybind = alt+two=text:\x1b2
keybind = alt+three=text:\x1b3
keybind = alt+four=text:\x1b4
keybind = alt+five=text:\x1b5
keybind = alt+six=text:\x1b6
keybind = alt+seven=text:\x1b7
keybind = alt+eight=text:\x1b8
keybind = alt+nine=text:\x1b9
