# ctmux (Linux) key bindings — sourced into the tmux server by `ctmux` (ensure / attach).
#
# On macOS cmux shows tmux windows as tabs: Ctrl+Tab / Ctrl+Shift+Tab switch tab, Cmd+1..9
# pick one, Cmd+T opens one. A Linux terminal has no such tabs for tmux windows, so the same
# keys drive tmux windows directly. A terminal can only deliver Ctrl+Tab to tmux as an
# extended key (a plain Tab is all VTE-based terminals such as Ptyxis / GNOME Terminal ever
# send), so tmux must read CSI-u / modifyOtherKeys sequences: the Ghostty window opened by
# `ctmux terminal` sends them (linux/ghostty.conf).
#
# Everything is a global root-table binding; nothing here touches the prefix table.
# Personal additions or overrides go in ~/.config/ctmux/tmux.conf (sourced after this file).

set -s extended-keys on

bind -n C-Tab next-window
bind -n C-BTab previous-window          # Ctrl+Shift+Tab (tmux 3.6 names shift+tab "BTab")
bind -n C-S-Tab previous-window         # ... and older tmux (3.4) reads the same CSI-u as C-S-Tab
bind -n C-S-t new-window -c '#{pane_current_path}'
# Alt+digit is an ordinary key in other terminals' programs, so only a Ghostty client (the ctmux
# window; Ghostty's own Alt+digit tab keys are rebound to plain Alt+digit there) gets the window
# bindings; every other client passes the key through.
bind -n M-1 if -F '#{m:xterm-ghostty*,#{client_termname}}' 'select-window -t :1' 'send-keys M-1'
bind -n M-2 if -F '#{m:xterm-ghostty*,#{client_termname}}' 'select-window -t :2' 'send-keys M-2'
bind -n M-3 if -F '#{m:xterm-ghostty*,#{client_termname}}' 'select-window -t :3' 'send-keys M-3'
bind -n M-4 if -F '#{m:xterm-ghostty*,#{client_termname}}' 'select-window -t :4' 'send-keys M-4'
bind -n M-5 if -F '#{m:xterm-ghostty*,#{client_termname}}' 'select-window -t :5' 'send-keys M-5'
bind -n M-6 if -F '#{m:xterm-ghostty*,#{client_termname}}' 'select-window -t :6' 'send-keys M-6'
bind -n M-7 if -F '#{m:xterm-ghostty*,#{client_termname}}' 'select-window -t :7' 'send-keys M-7'
bind -n M-8 if -F '#{m:xterm-ghostty*,#{client_termname}}' 'select-window -t :8' 'send-keys M-8'
bind -n M-9 if -F '#{m:xterm-ghostty*,#{client_termname}}' 'select-window -t :9' 'send-keys M-9'
